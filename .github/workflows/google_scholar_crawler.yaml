name: Get Citation Data

on:
  page_build:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

concurrency:
  group: google-scholar-crawler
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python3 -m pip install --no-cache-dir -r google_scholar_crawler/requirements.txt
      - name: Test citation parser
        run: python3 -m unittest discover -s google_scholar_crawler
      - name: Fetch citation data
        timeout-minutes: 5
        working-directory: google_scholar_crawler
        run: python3 -u main.py
        env:
          GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID }}
      - name: Publish citation data
        run: |
          export remote_repo="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git"

          if git clone --depth 1 --single-branch --branch google-scholar-stats "${remote_repo}" ./google-scholar-stats; then
            echo "Fetched existing google-scholar-stats branch"
          else
            git clone --depth 1 "${remote_repo}" ./google-scholar-stats
            cd ./google-scholar-stats
            git checkout --orphan google-scholar-stats
            git rm -rf . >/dev/null 2>&1 || true
            cd ..
          fi

          cp ./google_scholar_crawler/results/*.json ./google-scholar-stats/
          cd ./google-scholar-stats
          git config --local user.name "${GITHUB_ACTOR}"
          git config --local user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          git add *.json

          if git diff --cached --quiet; then
            echo "No citation changes detected, skip push."
            exit 0
          fi

          git commit -m "Updated Citation Data"
          git push origin google-scholar-stats
