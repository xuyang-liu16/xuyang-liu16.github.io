name: Get Citation Data

on:
  page_build:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

concurrency:
  group: google-scholar-crawler
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python3 -m pip install --no-cache-dir -r google_scholar_crawler/requirements.txt
      - name: Test citation parser
        run: python3 -m unittest discover -s google_scholar_crawler
      - name: Check citation data freshness
        id: freshness
        run: |
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from urllib.request import urlopen

          url = (
              "https://raw.githubusercontent.com/"
              f"{os.environ['GITHUB_REPOSITORY']}/google-scholar-stats/gs_data.json"
              f"?run={os.environ['GITHUB_RUN_ID']}"
          )
          needs_update = True
          try:
              with urlopen(url, timeout=15) as response:
                  data = json.load(response)
              updated = datetime.fromisoformat(data["updated"])
              age = (datetime.now(timezone.utc) - updated).total_seconds()
              needs_update = not (0 <= age < 8 * 60 * 60)
              print(f"Citation data: {data['citedby']}, updated {updated.isoformat()}")
          except Exception as exc:
              print(f"Could not confirm fresh citation data: {exc}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"needs_update={str(needs_update).lower()}\n")
          if not needs_update:
              print("Recent verified data is available; skip cloud scraping.")
          PY
      - name: Fetch citation data
        if: steps.freshness.outputs.needs_update == 'true'
        timeout-minutes: 5
        working-directory: google_scholar_crawler
        run: python3 -u main.py
        env:
          GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID }}
      - name: Publish citation data
        if: steps.freshness.outputs.needs_update == 'true'
        run: |
          export remote_repo="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git"

          if git clone --depth 1 --single-branch --branch google-scholar-stats "${remote_repo}" ./google-scholar-stats; then
            echo "Fetched existing google-scholar-stats branch"
          else
            git clone --depth 1 "${remote_repo}" ./google-scholar-stats
            cd ./google-scholar-stats
            git checkout --orphan google-scholar-stats
            git rm -rf . >/dev/null 2>&1 || true
            cd ..
          fi

          cp ./google_scholar_crawler/results/*.json ./google-scholar-stats/
          cd ./google-scholar-stats
          git config --local user.name "${GITHUB_ACTOR}"
          git config --local user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          git add *.json

          if git diff --cached --quiet; then
            echo "No citation changes detected, skip push."
            exit 0
          fi

          git commit -m "Updated Citation Data"
          git push origin google-scholar-stats
